<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "fr" }}">

  {%- include head.html -%}

  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    {%- include header.html -%}

    <main class="page-content" id="contenu">
      {{ content }}
    </main>

    {%- include footer.html -%}

    <script src="{{ "/assets/theme.js" | relative_url }}?v={{ site.time | date: "%s" }}" defer></script>
    {%- if page.url == "/recherche/" -%}
      <script src="{{ "/assets/recherche.js" | relative_url }}?v={{ site.time | date: "%s" }}" defer></script>
    {%- endif -%}
  </body>

</html>
