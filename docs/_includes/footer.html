<footer class="site-footer">
  <div class="wrapper site-footer__inner">
    <p class="site-footer__desc">{{ site.description | escape }}</p>
    <p class="site-footer__meta">
      Écrit par {{ site.author | escape }} —
      <a href="https://github.com/{{ site.repository }}">le dépôt</a> ·
      <a href="{{ "/feed.xml" | relative_url }}">flux RSS</a> ·
      <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE">licence MIT</a>
    </p>
    <p class="site-footer__note">La connaissance grandit quand on la partage.</p>
  </div>
</footer>
